services:
  postgres:
    image: postgres:16
    container_name: servicehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: servicehub
      POSTGRES_PASSWORD: servicehub
      POSTGRES_DB: servicehub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: 